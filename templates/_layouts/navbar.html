{% load static %}

<nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom sticky-top">
  <div class="container py-2">
    <a class="navbar-brand d-flex align-items-center gap-2 fw-semibold" href="{% url 'core:home' %}">
      <img
        src="{% static 'images/pawlink-logo.svg' %}"
        alt="Логотип Pawlink"
        width="32"
        height="32"
      >
      <span>Pawlink</span>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#mainNavbar"
      aria-controls="mainNavbar"
      aria-expanded="false"
      aria-label="Відкрити навігацію"
    >
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="mainNavbar">
      <ul class="navbar-nav me-auto mb-3 mb-lg-0 ms-lg-4">
        <li class="nav-item">
          <a
            class="nav-link {% if request.resolver_match.namespace == 'animals' %}active fw-semibold{% endif %}"
            href="{% url 'animals:animals' %}"
            {% if request.resolver_match.namespace == 'animals' %}aria-current="page"{% endif %}
          >Тварини</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if request.resolver_match.view_name == 'core:about' %}active fw-semibold{% endif %}"
            href="{% url 'core:about' %}"
            {% if request.resolver_match.view_name == 'core:about' %}aria-current="page"{% endif %}
          >Про нас</a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link {% if request.resolver_match.view_name == 'core:contacts' %}active fw-semibold{% endif %}"
            href="{% url 'core:contacts' %}"
            {% if request.resolver_match.view_name == 'core:contacts' %}aria-current="page"{% endif %}
          >Контакти</a>
        </li>
      </ul>

      <div class="d-flex flex-column flex-lg-row align-items-lg-center gap-2">
        {% if user.is_authenticated %}
          {% if user.is_staff %}
            <span class="badge rounded-pill text-bg-primary me-lg-1">Адміністратор</span>
          {% endif %}

            {% if user.is_shelter %}
                <a class="btn btn-outline-primary" href="{% url 'dashboard:shelter_dashboard' %}" >Профіль притулку</a>
            {% else %}
                <button class="btn btn-outline-primary" type="button">Профіль</button>
            {% endif %}

          <form class="m-0" method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button class="btn btn-outline-secondary w-100" type="submit">Вийти</button>
          </form>
        {% else %}
          <a class="btn btn-outline-secondary" href="{% url 'accounts:login' %}">Увійти</a>
          <a class="btn btn-primary" href="{% url 'accounts:register' %}">Зареєструватися</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
